    >
      <h1
        class="m-0 self-stretch relative text-[length:inherit] leading-[120%] font-bold font-[inherit] mq375:font-bold mq375:font-roboto mq375:text-[36px] mq375:leading-[120%] mq375:text-left mq375:block mq375:self-stretch mq375:w-full mq375:h-auto"
      >
        FAQs
      </h1>
      <div
        class="self-stretch relative text-Text-Sizes-Text-Medium leading-[150%] mq375:font-roboto mq375:text-[16px] mq375:leading-[150%] mq375:text-left mq375:block mq375:self-stretch mq375:w-full mq375:h-auto"
      >
        Find answers to common questions about our Islamic bookstore and
        services.
      </div>
    </div>
    <div
      class="self-stretch flex flex-col items-start justify-start gap-4 mq375:flex mq375:self-stretch mq375:w-full mq375:h-auto mq375:flex-col mq375:gap-4 mq375:items-start mq375:justify-start"
    >
      <accordion
        [question]="'What types of books?'"
        [text]="'We offer a wide range of Islamic books, including Qurans, Hadith collections, and scholarly texts. Our selection also features childrens books and contemporary Islamic literature. Whether youre looking for religious guidance or educational material, we have something for everyone.'"
      >
      </accordion
      ><accordion
        [question]="'How to place an order?'"
        [text]="'To place an order, simply browse our categories and select the books you wish to purchase. Add them to your cart and proceed to checkout. You can choose your preferred payment method to complete the transaction.'"
      >
      </accordion
      ><accordion
        [question]="'Do you offer shipping?'"
        [text]="'Yes, we offer shipping options for both domestic and international orders. Shipping costs and delivery times vary based on your location. You can view the shipping details during the checkout process.'"
      >
      </accordion
      ><accordion
        [question]="'Can I return books?'"
        [text]="'Yes, we have a return policy in place. If you receive a damaged or incorrect book, please contact us within 30 days for a return or exchange. Ensure that the books are in their original condition.'"
      >
      </accordion
      ><accordion
        [question]="'How to contact support?'"
        [text]="'You can reach our support team through the contact form on our website. Alternatively, you can email us directly for assistance. We aim to respond to all inquiries within 24 hours.'"
      >
      </accordion>
    </div>
    <div
      class="w-full flex flex-col items-start justify-start gap-6 max-w-Max-Width-max-width-medium text-Text-Sizes-Heading-4 mq375:flex mq375:w-full mq375:h-auto mq375:flex-col mq375:gap-6 mq375:items-start mq375:justify-start mq375:max-w-Max-Width-max-width-medium"

        <div
          class="self-stretch relative text-Text-Sizes-Text-Medium leading-[150%] mq375:font-roboto mq375:text-[16px] mq375:leading-[150%] mq375:text-left mq375:block mq375:self-stretch mq375:w-full mq375:h-auto"
