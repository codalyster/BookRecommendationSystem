<header
  class="self-stretch h-[72px] bg-Color-Scheme-1-Background flex flex-col items-center justify-center py-0 px-Page-Padding-padding-global box-border text-left text-Text-Sizes-Text-Regular text-Color-Scheme-1-Text font-roboto mq375:flex mq375:self-stretch mq375:w-full mq375:h-auto mq375:flex-col mq375:gap-0 mq375:items-start mq375:justify-start"
>
  <div
    class="self-stretch flex flex-row items-center justify-between gap-0 mq375:flex mq375:self-stretch mq375:w-full mq375:h-16 mq375:flex-row mq375:items-center mq375:justify-between mq375:gap-0 mq375:py-0 mq375:pl-5 mq375:pr-3 mq375:box-border"
  >
    <div
      class="w-20 h-10 flex flex-row items-center justify-center mq375:flex mq375:w-auto mq375:[align-self:unset] mq375:h-auto mq375:flex-row mq375:gap-0 mq375:items-start mq375:justify-start"
    >
      <company-logo [alternate]="false"> </company-logo>
    </div>
    <img
      class="w-12 h-12 hidden lg:hidden md:hidden sm:hidden mq350small:hidden mq375:flex"
      alt=""
      src="assets/icon.svg"
    />
    <div class="flex flex-row items-center justify-center gap-8 mq375:hidden">
      <div class="flex flex-row items-center justify-end gap-8">
        <div class="flex flex-row items-center justify-center">
          <div class="relative leading-[150%]">Home Page</div>
        </div>
        <div class="flex flex-row items-center justify-center">
          <div class="relative leading-[150%]">Book Categories</div>
        </div>
        <div class="flex flex-row items-center justify-center">
          <div class="relative leading-[150%]">Best Sellers</div>
        </div>
        <div class="flex flex-row items-center justify-center relative gap-1">
          <div class="flex flex-row items-center justify-start gap-1 z-[0]">
            <div class="relative leading-[150%]">More Options</div>
            <img
              class="w-6 relative h-6 overflow-hidden shrink-0"
              alt=""
              src="assets/chevron-down.svg"
            />
          </div>
          <div
            class="!!m-[0 important] absolute top-[32px] left-[0px] bg-Color-Scheme-1-Background border-Color-Scheme-1-Border border-solid border-Stroke-Border-Width overflow-hidden hidden flex-col items-start justify-start p-6 gap-4 z-[1]"
          >
            <div class="self-stretch relative leading-[150%]">
              Islamic Fiction
            </div>
            <div class="self-stretch relative leading-[150%]">
              Children's Books
            </div>
            <div class="self-stretch relative leading-[150%]">
              Religious Texts
            </div>
          </div>
        </div>
      </div>
      <div class="flex flex-row items-center justify-center gap-4">
        <button-1
          [alternate]="false"
          [iconPosition]="'No icon'"
          [small]="true"
          [style]="'Secondary'"
          [button]="'Login'"
        >
        </button-1
        ><button-1
          [alternate]="false"
          [iconPosition]="'No icon'"
          [small]="true"
          [style]="'Primary'"
          [button]="'Sign Up'"
        >
        </button-1>
      </div>
    </div>
  </div>
</header>
